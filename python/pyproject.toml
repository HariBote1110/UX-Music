[project]
name = "lyrics-sync-sidecar"
version = "2.0.1"
description = "UX-Music lyrics auto-sync pipeline (Demucs → faster-whisper → alignment)"
requires-python = ">=3.10,<3.13"

dependencies = [
  "numpy>=1.26",
  "torch>=2.2,<3",
  "torchaudio>=2.2,<3",
  "demucs>=4.0",
  "faster-whisper>=1.1",
  "sentence-transformers>=3.0,<4",
  "transformers>=4.40,<5",
  "pyopenjtalk>=0.3",
  "g2p-en>=2.1,<3",
  "soundfile>=0.12,<1",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
# ほとんどのテストは pytest と numpy だけで動く。torch/demucs を含む base
# dependencies を入れずにテストを回すための軽量な extra。
# `pip install --no-deps -e "." && pip install ".[test]"` 相当の使い方を想定。
test = [
  "pytest>=8.0",
  "numpy",
]
# Phase 1 of markdown/ai-feature-special-plan.md: CLAP-based audio embeddings.
# Installed on demand: `python/.venv/bin/pip install -e ".[audio-embed]"`.
audio-embed = [
  "laion-clap>=1.1.6",
  "librosa>=0.10,<1",
  "torchvision>=0.17,<1",
]
# Phase 3 of markdown/ai-feature-special-plan.md: Gemma 4 E2B via MLX-LM.
# Installed on demand: `python/.venv/bin/pip install -e ".[gemma-special]"`.
gemma-special = [
  "mlx>=0.19",
  "mlx-lm>=0.20",
]

[tool.setuptools]
packages = ["lyrics_sync", "audio_embed"]

[tool.pytest.ini_options]
markers = [
  "heavy: neural models and long audio",
]
